name: Scorecard

# OpenSSF Scorecard: scores the repository's security practices (pinned actions, branch protection, dependency updates, a security policy and
# so on) and sends the findings to code scanning (Security tab). Weekly, and on every push to main.
on:
  schedule:
    - cron: "17 5 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default; the one job asks for what it needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # to send the results to code scanning
      id-token: write # to publish the result with the project's identity (public repositories)
      contents: read
      actions: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Send the results to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
