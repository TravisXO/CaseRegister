name: CI

# Needs no secrets: the tests use Cloudflare's published Turnstile test keys and certificates generated for each run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only unless a job asks for more.
permissions:
  contents: read

# A new push to a branch cancels the run that was still going for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      # Locked mode: the restore fails if any package differs from the committed packages.lock.json files.
      - name: Restore (locked)
        run: dotnet restore CaseRegister.slnx --locked-mode

      # Warnings are errors (also set in Directory.Build.props; stated here so CI cannot be loosened by accident).
      - name: Build
        run: dotnet build CaseRegister.slnx --configuration Release --no-restore -warnaserror

      # The tests start PostgreSQL in Docker (Testcontainers), which the runner has.
      - name: Test, with coverage
        run: >
          dotnet test CaseRegister.slnx --configuration Release --no-build
          --settings coverage.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory coverage
          --blame-hang-timeout 10m --blame-hang-dump-type none

      - name: Coverage report
        if: ${{ !cancelled() }}
        run: |
          dotnet tool restore
          dotnet reportgenerator -reports:"coverage/**/coverage.cobertura.xml" -targetdir:coverage/report -reporttypes:"Html;MarkdownSummaryGithub;TextSummary"
          cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage
          if-no-files-found: error
          retention-days: 30

  vulnerable-packages:
    name: Vulnerable packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore (locked)
        run: dotnet restore CaseRegister.slnx --locked-mode

      # `dotnet list package --vulnerable` exits 0 even when it finds something, so the output is checked.
      - name: Fail on any vulnerable package, direct or transitive
        run: |
          dotnet list CaseRegister.slnx package --vulnerable --include-transitive --no-restore 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::A package with a known vulnerability is in use. See the list above."
            exit 1
          fi

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's own checksums file. Update both together.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      # The whole history, not just the latest commit.
      - name: Check out with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        run: |
          curl --fail --silent --show-error --location --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan every commit
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose

  docker-image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Built, never pushed.
      - name: Build the image
        run: docker build --tag caseregister-api:ci .

      # Fails on a HIGH or CRITICAL issue that has a fix available. Issues with no fix yet are reported by Trivy but do not fail the build.
      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: caseregister-api:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Exactly what the lock file says, and no package's install script is run.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # The front end's types are generated from the API's own description. If they are not what the description says, one was changed without the other.
      - name: Types match the API description
        run: |
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # What is built has to be servable under the strict policy: no inline script or style, no source maps, no eval.
      - name: Check the build
        run: npm run check:build

      - name: Audit
        run: npm audit --audit-level=high